# ============================================================
# gradle.properties ? managed & audited March 2026
# ============================================================

# ----- JVM / Daemon performance -----
# [UPDATED] Increased from 2048m ? 4096m for AGP 9 + KSP2 builds.
# AGP 9 with built-in Kotlin uses more metaspace; 256m is insufficient.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel project execution (safe for decoupled single-module project)
org.gradle.parallel=true

# Enable Gradle Build Cache for faster incremental builds
org.gradle.caching=true

# Enable configuration cache (stable in Gradle 8.x / 9.x)
org.gradle.configuration-cache=true

# ----- AndroidX -----
android.useAndroidX=true
android.enableJetifier=false

# ----- Kotlin -----
kotlin.code.style=official

# ----- AGP 9 -----
# AGP 9.x bundles and applies the kotlin-android plugin automatically.
# Do NOT declare kotlin-android in build.gradle.kts ? it causes a classpath collision.
android.disallowKotlinSourceSets=true

# [FIX] Disable built-in Kotlin to avoid version mismatch with Realm compiler plugin
android.builtInKotlin=false

# Suppress KSP1 deprecation warnings (KSP2 is default since 2.0.0)
# warn.on.ksp1.usage=false

# ----- R8 / Build -----
# [ADDED] Suppress R8 repackaging warnings introduced in AGP 9.1
android.r8.repackaging=true
