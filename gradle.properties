org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true  ? disabled: KSP incompatible

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP adds generated sources via kotlin.sourceSets DSL which AGP 9 rejects
# by default. This flag restores the permissive behaviour until KSP ships
# a native AGP 9 integration.
android.disallowKotlinSourceSets=false