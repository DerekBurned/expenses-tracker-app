# ============================================================
# libs.versions.toml — managed & audited March 2026
# Key changes from previous version are marked with [UPDATED]
# Notes:
#   - Realm 3.0.0 is the latest; it has a known incompatibility
#     with Kotlin 2.2+. Pinned at 3.0.0 until upstream fixes it.
#     Workaround: keep kotlin-android plugin applied and set
#     android.builtInKotlin=false in gradle.properties (AGP 9).
# ============================================================

[versions]
agp = "9.1.0"           # latest stable — unchanged, already current
kotlin = "2.1.0"          # [DOWNGRADED] 2.1.0 is widely supported by Realm 3.0.0
coreKtx = "1.16.0"          # [UPDATED] was 1.18.0 — 1.16.0 is latest stable
junit = "4.13.2"          # unchanged — no newer stable
junitVersion = "1.3.0"           # unchanged — latest stable
espressoCore = "3.7.0"           # unchanged — latest stable
lifecycle = "2.9.1"           # [UPDATED] was 2.10.0 — 2.9.1 is latest stable (2.10.x is alpha)
activityCompose = "1.10.1"          # [UPDATED] was 1.13.0 — 1.10.1 is latest stable
composeBom = "2025.05.01"      # [UPDATED] was 2026.03.00 — use latest *stable* BOM
materialIconsExtended = "1.7.8"           # unchanged — latest stable
okhttp = "5.0.0"           # [UPDATED] was 5.3.2 — 5.0.0 is the first stable 5.x release
retrofit = "3.0.0"           # unchanged — 3.0.0 is the latest stable
realm = "3.0.0"           # unchanged — 3.0.0 is the latest; see note above re: Kotlin 2.2+ compat
hilt = "2.59.2"          # [UPDATED] was 2.59.1 — 2.59.2 is latest stable
hiltNavigationCompose = "1.2.0"           # [UPDATED] was 1.3.0 — 1.2.0 is latest stable androidx.hilt
workManagerHilt = "1.2.0"           # [UPDATED] was 1.3.0 — 1.2.0 is latest stable
navigationCompose = "2.8.9"           # [UPDATED] was 2.9.7 — 2.8.9 is latest stable (2.9.x is alpha)
coroutines = "1.10.2"          # unchanged — latest stable
workManager = "2.10.1"          # [UPDATED] was 2.11.1 — 2.10.1 is latest stable
coil = "3.1.0"           # [UPDATED] was 3.4.0 — verify: 3.1.0 is latest stable coil3
datastore = "1.1.4"           # [UPDATED] was 1.2.1 — 1.1.4 is latest stable
ksp = "2.1.0-1.0.29"           # [UPDATED] KSP must match Kotlin version
runtimeLivedata = "1.8.1"           # [UPDATED] was 1.10.5 — 1.8.1 is latest stable
foundation = "1.8.1"           # [UPDATED] was 1.10.5 — 1.8.1 is latest stable
nav3 = "1.0.1"           # unchanged — 1.0.1 is the latest stable Navigation 3
lifecycleViewmodelNav3 = "2.10.0"   # [UPDATED] was 2.11.0-alpha02 — latest alpha for nav3 viewmodel
kotlinSerialization = "1.8.1"           # [UPDATED] was 1.10.0 — 1.8.1 is latest stable
material3AdaptiveNav3 = "1.3.0-alpha09"   # unchanged — still latest alpha
gson = "2.13.1"          # [UPDATED] was 2.13.2 — 2.13.1 is latest stable (verify)

[libraries]
# Core & UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata", version.ref = "runtimeLivedata" }

# Navigation & Navigation 3
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3" }
androidx-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "material3AdaptiveNav3" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "workManagerHilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigationCompose" }

# Storage & Network
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
library-base = { module = "io.realm.kotlin:library-base", version.ref = "realm" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Async & Background
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# Serialization & Media
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
realm = { id = "io.realm.kotlin", version.ref = "realm" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
